{% extends 'base.html' %}

{% block title %}Главная страница{% endblock %}

{% block content %}
<div class = "main_page">
        {% for post in posts %}
        <div class = "main_page_post">
            <div class="post-box">
                <div class="post-header">
                    <div class="btn_box_post">
                    <a class="round heart" href="#" title="Понравилось"></a>
                    <a class="round open" href="#" title="Открыть полностью"><div class="arrow"></div><div class="arrow_diff"></div></a>
                    <a class="round zakladka" href="#" title="В закладки"></a>
                    </div>
                    <h2 class="post-name"></h2>
                    <p class="post-author">{{ post.author }}</p>
                </div>

                <div class="text-wrap">
                    <div class="post-text">{{ post.content }}</div>
                </div>

                <div class="post-image"></div>
            </div>
        </div>
        {% endfor %}
</div>
{% endblock %}
