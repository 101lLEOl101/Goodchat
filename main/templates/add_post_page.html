{% extends 'base.html' %}

{% block title %}Новый пост{% endblock %}

{% block content %}
	<div class = "post-workspace">
		<div class = "new-post-header">
			<button class = "add-new-post-btn" form="new-post-form">Добавить запись</button>
		</div>
		<div class = "new-post-text-img">
			<form method="POST" id="new-post-form">
				{% csrf_token %} 
				{{ form }}
			</form>
			<div class="image-placeholder"></div>
		</div>
	</div>
{% endblock %}
