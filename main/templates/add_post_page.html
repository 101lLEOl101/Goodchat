{% extends 'base.html' %}

{% block title %}Новый пост{% endblock %}

{% block content %}
	<div class = "post-workspace">
		<div class = "new-post-header">
			<button class = "btn_post" form="new-post-form">Добавить запись</button>
		</div>
		<div class = "new-post-text-img">
			<form method="POST" id="new-post-form" class="form-add-post">
				{% csrf_token %}
                {% for f in form %}
				{{f}}
				{% endfor %}
				<div class="input-file-row" id = "box-img">
						<label class="input-file" id = "add_btn">
						<input type="file" name="file[]" multiple accept="image/*">
						<span>Выберите Изображение</span>
						</label>
					<div class="input-file-list">
					</div>
				</div>
			</form>
		</div>
	</div>
<script src="https://snipp.ru/cdn/jquery/2.1.1/jquery.min.js"></script>
<script>
var dt = new DataTransfer();

$('.input-file input[type=file]').on('change', function(){
	let $files_list = $(this).closest('.input-file').next();
	$files_list.empty();
	for(var i = 0; i < this.files.length; i++){
		let file = this.files.item(i);
		dt.items.add(file);

		let reader = new FileReader();
		reader.readAsDataURL(file);
		reader.onloadend = function(){
			let new_file_input = '<div class="input-file-list-item">' +
				'<img class="input-file-list-img" src="' + reader.result + '">' +
				'<span class="input-file-list-name">' + file.name + '</span>' +
				'<a href="#" onclick="removeFilesItem(this); return false;" class="input-file-list-remove">x</a>' +
			'</div>';
			$files_list.append(new_file_input);
		}
	};
	this.files = dt.files;
	let btn = document.getElementById("add_btn");
	btn.style.visibility = "hidden";
	btn.style.width = '0';
	btn.style.height = '0';
	btn.style.margin = '0';
	document.getElementById("box-img").style.height = "auto";
});

function removeFilesItem(target){
	let name = $(target).prev().text();
	let input = $(target).closest('.input-file-row').find('input[type=file]');
	$(target).closest('.input-file-list-item').remove();
	for(let i = 0; i < dt.items.length; i++){
		if(name === dt.items[i].getAsFile().name){
			dt.items.remove(i);
		}
	}
	input[0].files = dt.files;
	document.getElementById('add_btn').removeAttribute("style");
	document.getElementById("box-img").removeAttribute("style");
}
</script>
{% endblock %}
