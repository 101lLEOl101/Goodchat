{% extends 'base.html' %}

{% block title %}Новый пост{% endblock %}

{% block content %}
	<div class = "post-workspace">
		<div class = "new-post-header">
			<input type = "text" class = "new-post-naming" placeholder="Name of new post">
			<button class = "add-new-post-btn">Добавить запись</button>
		</div>
		<div class = "new-post-text-img">
			<textarea class = "text-of-new-post" placeholder="Ваш текст"></textarea>
			<div class="image-placeholder"></div>
		</div>
	</div>
{% endblock %}
