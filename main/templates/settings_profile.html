{% extends 'base.html' %}

{% block title %}Настройки{% endblock %}

{% block content %}
    <div class="profile_box">
        <img src="{{ profile.avatar.url }}" class="profile-pic" />
        <h3 class="user-nickname">Имя: {{ profile.name }} </h3>
        <p class="user-nickname">Фамилия: {{ profile.surname }}</p>
        <p class="user-info">About user <br> {{ profile.about }} </p>
        <p class="user-nickname">Мне нравится: {{ profile.hobby }}</p>
        <button class="btn_add" style="width: 250px; margin-left: 80px"> Подробне </button>
    </div>
{% endblock %}
