{% extends 'base.html' %}
{% block title %}Закладки{% endblock %}

{% block content %}
<div class = "main_page">
    {% for i in posts %}
    <div class="post-box">
        <div class="post-header">
          <p class="post-author">{{i.author}}</p>
        </div>

        <div class="text-wrap">
          <div class="post-text">{{i.content}}</div>
          <i class="fa-regular fa-bookmark post-bookmark"></i>
        </div>

        <div class="post-image"></div>
    </div>
    {% endfor %}
</div>
{% endblock %}
