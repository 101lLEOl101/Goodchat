{% extends 'base.html' %}
{% load static %}

{% block style %}<link rel="stylesheet" href="{% static '/css/chatlist.css' %}">{% endblock %}
{% block title %}Мессенджер{% endblock %}

{% block content %}
    <div class="chat_box">
        <h2 style="text-align:center;"> Личные сообщения </h2>

        {% for chat in chats %}
        <a href="{% url 'chat' chat.id %}">
            <div class="chat_item">
                <img class="chat-user-pic" src="{{chat.avatar.url}}">
                <div class="chat_texts">
                <h2>{{ chat.name }}</h2>
                <h3 id="last_message">{{ chat.last_message.content }}</h3>
                </div>
            </div>
        </a>
        {% endfor %}

    </div>
{% endblock %}
{% block js %}
<script src="{% static '/js/chatlist.js' %}"></script>
{% endblock %}
